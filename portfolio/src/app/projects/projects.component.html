<!-- bradcrumbs -->
<app-breadcrumb></app-breadcrumb>
<!-- spinner if loading view -->
@if (loading) {
  <div class="spinner-container">
    <mat-spinner color="accent"></mat-spinner>
  </div>
}
@if (!loading) {
  <div class="loaded-container">
    <!-- view loaded, show projects if not child component, else just child component -->
    @if (outlet.isActivated == false) {
      <div class="projects-container">
        @for (project of projects; track project) {
          <div>
            @if (!!project.href) {
              <a
                class="links"
                href="{{ project.href ? project.href : null }}"
                >
                <div class="square">
                  <div class="project-image-container">
                    <img src="{{ project.pathImg }}" />
                  </div>
                  <div class="project-description-container">
                    <em
                      ><h3 class="description">{{ project.description }}</h3></em
                      >
                    </div>
                  </div>
                </a>
              }
              @if (!!project.routerLink) {
                <a
                  class="links"
                  routerLink="{{ project.routerLink ? project.routerLink : null }}"
                  >
                  <div class="square">
                    <div class="project-image-container">
                      <img src="{{ project.pathImg }}" />
                    </div>
                    <div class="project-description-container">
                      <em
                        ><h3 class="description">{{ project.description }}</h3></em
                        >
                      </div>
                    </div>
                  </a>
                }
              </div>
            }
          </div>
        }
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    }
