@if ((breadcrumbs$ | async).length >= 0) {
  <ul class="breadcrumbs">
    @for (breadcrumb of (breadcrumbs$ | async); track breadcrumb) {
      <li>
        <button mat-button routerLink="{{breadcrumb.url}}" [attr.aria-label]="'{{ breadcrumb.label }}'">
          {{ breadcrumb.label }}
        </button>
      </li>
    }
  </ul>
}
